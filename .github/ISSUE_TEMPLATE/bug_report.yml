name: Bug report
description: Report a reproducible problem in OpenQuota
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, access tokens, account identifiers, or unreviewed diagnostic logs.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I reproduced the problem with the latest OpenQuota release.
          required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: system-details
    attributes:
      label: System details
      description: Include the OS version, architecture, and desktop environment or display server when relevant.
      placeholder: Fedora 44, KDE Plasma, Wayland, x64
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenQuota version or commit
      placeholder: Version shown in the footer or a commit SHA
    validations:
      required: true

  - type: input
    id: installation
    attributes:
      label: Installation method
      description: Enter the package type or how OpenQuota was installed.
      placeholder: AppImage, .deb, Windows installer, macOS DMG, or source build
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options:
        - Not provider-specific
        - Claude Code
        - Codex
        - Cursor
        - Antigravity
        - Copilot
        - Devin
        - Grok
        - OpenCode
        - OpenRouter
        - Z.ai
        - Multiple providers
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or reviewed log excerpts if useful. Remove all sensitive information first.
